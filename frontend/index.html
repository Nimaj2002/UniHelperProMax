<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />

    <script src="/theme-boot.js"></script>
    <style>
      /* Splash shown while the app loads; src/components/SplashScreen.tsx renders the same markup */
      .uh-splash { position: fixed; inset: 0; display: grid; place-items: center; background: var(--surface, #f8f8f9); }
      [data-theme="dark"] .uh-splash { background: var(--surface, #131316); }
      .uh-splash-icon { position: relative; width: 112px; height: 112px; border-radius: 25px; display: grid; place-items: center; background: var(--accent, #2650c9); color: var(--accent-foreground, #fafafb); animation: uh-splash-pulse 1.6s ease-in-out infinite; }
      [data-theme="dark"] .uh-splash-icon { background: var(--accent, #8ba7ff); color: var(--accent-foreground, #0f1320); }
      .uh-splash-icon svg { position: relative; width: 80px; height: 80px; }
      /* two rings ripple out from the icon, half a beat apart */
      .uh-splash-icon::before, .uh-splash-icon::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: inherit; animation: uh-splash-ripple 1.6s ease-out infinite; }
      .uh-splash-icon::after { animation-delay: 0.8s; }
      @keyframes uh-splash-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(0.88); } }
      @keyframes uh-splash-ripple { 0% { transform: scale(1); opacity: 0.45; } 100% { transform: scale(1.7); opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .uh-splash-icon, .uh-splash-icon::before, .uh-splash-icon::after { animation: none; } .uh-splash-icon::before, .uh-splash-icon::after { opacity: 0; } }
    </style>
  </head>
