# Desktop app release (specs/015-desktop-app-packaging, research R18, contracts/packaging.md).
#
# Push a version tag (v1.2.3) → every system builds its installer with the same scripts used
# locally (scripts/build-desktop.sh / .ps1), runs the desktop end-to-end tests against a test
# build, and a draft GitHub Release collects the installers. Publish the draft by hand after
# checking it. "Run workflow" (workflow_dispatch) does a dry run: builds and tests, no release.
#
# The tag must equal desktop/package.json "version" and backend/pyproject.toml "version".
# First release: unsigned (code signing and notarization are out of scope, spec FR-052).
name: Desktop release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24.22.1"
  PYTHON_VERSION: "3.12"
  PNPM_VERSION: "12.9.1"

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            arch: arm64
            artifact: macos-arm64
          - name: Linux x64
            os: ubuntu-22.04 # oldest supported Ubuntu: its glibc keeps the backend runnable on newer distros
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the app versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          desktop=$(node -p "require('./desktop/package.json').version")
          # tr: the file may be checked out with CRLF line endings
          backend=$(tr -d '\r' < backend/pyproject.toml | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "tag=$tag desktop=$desktop backend=$backend"
          if [ "$tag" != "$desktop" ] || [ "$tag" != "$backend" ]; then
            echo "::error::Tag v$tag must equal desktop/package.json ($desktop) and backend/pyproject.toml ($backend)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build-desktop.ps1

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: scripts/build-desktop.sh --arch ${{ matrix.arch }}

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: scripts/build-desktop.sh

      - name: Install a virtual display (Linux e2e)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The e2e test build is the same app with one fuse flipped so Playwright can attach
      # (research R19); the installers above keep it off.
      - name: Desktop end-to-end tests
        working-directory: desktop
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            npm run build:e2e -- --${{ matrix.arch }}
          else
            npm run build:e2e
          fi
          export UNIHELPER_E2E_EXECUTABLE="$(node scripts/e2e-executable.cjs)"
          case "$RUNNER_OS" in
            Linux) xvfb-run -a npm run e2e ;;
            # hosted Macs can't grant the microphone permission (TCC): skip those tests there
            macOS) npm run e2e -- --grep-invert @microphone ;;
            *) npm run e2e ;;
          esac

      - name: Upload the e2e report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.artifact }}
          path: desktop/test-results
          if-no-files-found: ignore

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: dist

      - name: Collect files
        run: |
          mkdir upload
          find dist -type f -exec cp {} upload/ \;
          ls -la upload

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" upload/* \
            --draft \
            --title "UniHelperProMax ${GITHUB_REF_NAME#v}" \
            --notes "Desktop installers for Windows (x64), macOS (Apple Silicon) and Linux (AppImage, .deb).
          This release is not code-signed: see the README's Desktop app section for the warning each system shows and how to open the app."
