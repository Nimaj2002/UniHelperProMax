openapi: 3.1.0
info:
  title: UniHelperProMax API — feature 012 additions (task manager)
  version: 1.10.0
  description: |
    Additive to the 001–011 contracts (same conventions: camelCase JSON, RFC 9457 problems, CSRF
    header on writes, `If-Match: <version>` on updates and deletes of versioned rows → 428 when
    missing, 412 `version_conflict` when stale). Every operation is scoped to the signed-in user;
    another user's ids answer 404.

    Amended existing operations (documented again below with only the additions):
    `POST /events` (+ `addToBoard`), `GET /sessions` and `GET /sessions/{sessionKey}` (+ `taskId`),
    `DELETE /sessions/{sessionKey}` and `DELETE /years|semesters|courses/{id}` (+ `linkedTasks`),
    their `deletion-impact` (+ `linkedTaskCount`; + `taskCount` = live tasks of the courses
    that become personal — for a course, and for a year/semester its courses), `GET /trash`
    (+ `taskCount`). Existing response fields are unchanged.
servers:
  - url: /api/v1

paths:
  # ───────────────────────────── columns ─────────────────────────────
  /task-columns:
    get:
      tags: [tasks]
      summary: The board's columns in order (seeds To do / In progress / Done on first use)
      responses:
        "200":
          description: Columns
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaskColumn" } } } }
    post:
      tags: [tasks]
      summary: Add a column at the end
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskColumnCreate" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskColumn" } } }
        "409": { $ref: "#/components/responses/Problem" }   # column_limit (12) · name_taken
        "422": { $ref: "#/components/responses/Problem" }   # validation (name required, ≤ 40)

  /task-columns/order:
    put:
      tags: [tasks]
      summary: Reorder all columns
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskColumnOrder" } } }
      responses:
        "200":
          description: Columns in the new order
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaskColumn" } } } }
        "409": { $ref: "#/components/responses/Problem" }   # order_mismatch

  /task-columns/{columnId}:
    parameters: [{ $ref: "#/components/parameters/ColumnId" }]
    patch:
      tags: [tasks]
      summary: Rename a column or change whether it counts as done
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskColumnPatch" } } }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskColumn" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }   # name_taken
        "412": { $ref: "#/components/responses/Problem" }   # version_conflict
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tasks]
      summary: Delete a column; a column holding tasks needs moveTo
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { name: moveTo, in: query, required: false, schema: { type: string }, description: "Column receiving the tasks (required when the column holds live tasks)" }
      responses:
        "200":
          description: Deleted; returns the remaining columns
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TaskColumn" } } } }
        "404": { $ref: "#/components/responses/Problem" }   # column or moveTo not found
        "409": { $ref: "#/components/responses/Problem" }   # last_column · move_target_required
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }

  # ───────────────────────────── tasks ─────────────────────────────
  /tasks:
    get:
      tags: [tasks]
      summary: All live tasks of the user (board, list, rail, calendar and course lists derive from this)
      responses:
        "200":
          description: Tasks
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Task" } } } }
    post:
      tags: [tasks]
      summary: Create a task (title only is enough); with eventKey it is linked to that event occurrence
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskCreate" } } }
      responses:
        "201":
          description: Created at the end of its column
          content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } }
        "404": { $ref: "#/components/responses/Problem" }   # column, course or event occurrence not found
        "409": { $ref: "#/components/responses/Problem" }   # event_has_task
        "422": { $ref: "#/components/responses/Problem" }   # validation · time_without_date · not_an_event

  /tasks/export:
    get:
      tags: [tasks]
      summary: CSV file of every live task (declared before /tasks/{taskId})
      responses:
        "200":
          description: "UTF-8 CSV with BOM; Content-Disposition attachment; filename=\"<app>-tasks-<date>.csv\"; Cache-Control: no-store"
          content: { text/csv: { schema: { type: string } } }

  /tasks/{taskId}:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    get:
      tags: [tasks]
      summary: One task with its checklist items
      responses:
        "200":
          description: Task details
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }
    patch:
      tags: [tasks]
      summary: Update fields (title and due are read-only for linked tasks)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskPatch" } } }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }   # linked_field_read_only
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tasks]
      summary: Soft-delete (Undo with /restore for 24 h); never touches the linked event
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }

  /tasks/{taskId}/restore:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    post:
      tags: [tasks]
      summary: Undo a task deletion (position, checklist, quick notes, event link restored)
      responses:
        "200":
          description: Restored (unlinked if the occurrence got another task meanwhile; first column if its column is gone)
          content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } }
        "404": { $ref: "#/components/responses/Problem" }   # not deleted or expired

  /tasks/{taskId}/move:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    post:
      tags: [tasks]
      summary: Move to a column at an index among that column's live tasks (records or clears completion)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/TaskMove" } } }
      responses:
        "200":
          description: Moved; returns the task (other tasks' positions change; clients refetch /tasks)
          content: { application/json: { schema: { $ref: "#/components/schemas/Task" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }

  /tasks/{taskId}/checklist:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    put:
      tags: [tasks]
      summary: Replace the checklist (order = array order); bumps the task's version
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChecklistReplace" } } }
      responses:
        "200":
          description: Task with the new checklist
          content: { application/json: { schema: { $ref: "#/components/schemas/TaskDetail" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }

  # ───────────────────────────── quick notes ─────────────────────────────
  /tasks/{taskId}/quick-notes:
    parameters: [{ $ref: "#/components/parameters/TaskId" }]
    get:
      tags: [tasks]
      summary: The task's live quick notes, newest first
      responses:
        "200":
          description: Quick notes
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/QuickNote" } } } }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      tags: [tasks]
      summary: Add a quick note (title or body must be non-empty)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/QuickNoteWrite" } } }
      responses:
        "201":
          description: Created
          content: { application/json: { schema: { $ref: "#/components/schemas/QuickNote" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }   # empty_quick_note · validation

  /quick-notes/{noteId}:
    parameters: [{ $ref: "#/components/parameters/NoteId" }]
    patch:
      tags: [tasks]
      summary: Edit a quick note (autosave)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/QuickNoteWrite" } } }
      responses:
        "200":
          description: Updated
          content: { application/json: { schema: { $ref: "#/components/schemas/QuickNote" } } }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [tasks]
      summary: Soft-delete (Undo with /restore for 24 h)
      parameters: [{ $ref: "#/components/parameters/IfMatch" }]
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Problem" }
        "412": { $ref: "#/components/responses/Problem" }
        "428": { $ref: "#/components/responses/Problem" }

  /quick-notes/{noteId}/restore:
    parameters: [{ $ref: "#/components/parameters/NoteId" }]
    post:
      tags: [tasks]
      summary: Undo a quick-note deletion
      responses:
        "200":
          description: Restored
          content: { application/json: { schema: { $ref: "#/components/schemas/QuickNote" } } }
        "404": { $ref: "#/components/responses/Problem" }

  # ───────────────────────────── amended (additions only) ─────────────────────────────
  /events:
    post:
      tags: [events]
      summary: "(amended) Create an event; optional addToBoard creates a linked task for the first occurrence"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EventCreateAddition" } } }
      responses:
        "201": { description: "Created (EventCreated from 009; the creation record includes the task for /creations/undo)" }
        "404": { $ref: "#/components/responses/Problem" }   # column not found
        "422": { $ref: "#/components/responses/Problem" }

  /sessions/{sessionKey}:
    parameters: [{ $ref: "#/components/parameters/SessionKey" }]
    delete:
      tags: [sessions]
      summary: "(amended) Delete to the Trash; linkedTasks=delete puts linked tasks into the same Trash entry"
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/LinkedTasks" }
      responses:
        "200": { description: "ScopeResult (001/009)" }

  /sessions/{sessionKey}/deletion-impact:
    parameters: [{ $ref: "#/components/parameters/SessionKey" }]
    get:
      tags: [sessions]
      summary: "(amended) + linkedTaskCount"
      responses:
        "200":
          description: SessionDeletionImpact (009) with the addition
          content: { application/json: { schema: { $ref: "#/components/schemas/LinkedTaskImpact" } } }

  /courses/{courseId}/deletion-impact:
    parameters: [{ name: courseId, in: path, required: true, schema: { type: string } }]
    get:
      tags: [hierarchy]
      summary: "(amended) + linkedTaskCount, taskCount (tasks that become personal)"
      responses:
        "200":
          description: DeletionImpact (001) with the additions
          content: { application/json: { schema: { $ref: "#/components/schemas/CourseTaskImpact" } } }

components:
  parameters:
    ColumnId: { name: columnId, in: path, required: true, schema: { type: string } }
    TaskId: { name: taskId, in: path, required: true, schema: { type: string } }
    NoteId: { name: noteId, in: path, required: true, schema: { type: string } }
    SessionKey: { name: sessionKey, in: path, required: true, schema: { type: string } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: integer, minimum: 1 } }
    LinkedTasks:
      name: linkedTasks
      in: query
      required: false
      description: "Also on DELETE /years/{id}, /semesters/{id}, /courses/{id}. keep = unlink and keep as normal tasks (default); delete = into the event's Trash entry"
      schema: { type: string, enum: [keep, delete], default: keep }

  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }

    TaskColumn:
      type: object
      required: [id, name, position, countsAsDone, taskCount, version]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 40 }
        position: { type: integer, minimum: 0 }
        countsAsDone: { type: boolean }
        taskCount: { type: integer, minimum: 0, description: "Live tasks in the column" }
        version: { type: integer, minimum: 1 }

    TaskColumnCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        countsAsDone: { type: boolean, default: false }

    TaskColumnPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        countsAsDone: { type: boolean }

    TaskColumnOrder:
      type: object
      required: [columnIds]
      additionalProperties: false
      properties:
        columnIds: { type: array, minItems: 1, maxItems: 12, items: { type: string } }

    LinkedEvent:
      type: object
      required: [sessionKey, title, date]
      properties:
        sessionKey: { type: string }
        title: { type: string }
        date: { type: string, format: date }
        start: { type: [string, "null"], pattern: "^\\d{2}:\\d{2}$" }

    Task:
      type: object
      required: [id, columnId, position, title, description, dueDate, dueTime, courseId, courseName, courseColor,
                 event, completedAt, checklistDone, checklistTotal, quickNoteCount, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        columnId: { type: string }
        position: { type: integer, minimum: 0 }
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string }
        dueDate: { type: [string, "null"], format: date }
        dueTime: { type: [string, "null"], pattern: "^\\d{2}:\\d{2}$" }
        courseId: { type: [string, "null"] }
        courseName: { type: [string, "null"] }
        courseColor: { type: [string, "null"] }
        event: { oneOf: [{ $ref: "#/components/schemas/LinkedEvent" }, { type: "null" }] }
        completedAt: { type: [string, "null"], format: date-time }
        previousColumnId: { type: [string, "null"] }
        checklistDone: { type: integer, minimum: 0 }
        checklistTotal: { type: integer, minimum: 0 }
        quickNoteCount: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ChecklistItem:
      type: object
      required: [id, text, done]
      properties:
        id: { type: string }
        text: { type: string, minLength: 1, maxLength: 500 }
        done: { type: boolean }

    TaskDetail:
      allOf:
        - { $ref: "#/components/schemas/Task" }
        - type: object
          required: [checklist]
          properties:
            checklist: { type: array, items: { $ref: "#/components/schemas/ChecklistItem" } }

    TaskCreate:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: "Required unless eventKey is given (then taken from the event)" }
        columnId: { type: string, description: "Default: first column" }
        courseId: { type: [string, "null"] }
        dueDate: { type: [string, "null"], format: date }
        dueTime: { type: [string, "null"], pattern: "^\\d{2}:\\d{2}$" }
        description: { type: string, maxLength: 20000 }
        eventKey: { type: string, description: "Link to this event occurrence (Add to kanban from event details)" }

    TaskPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 20000 }
        dueDate: { type: [string, "null"], format: date }
        dueTime: { type: [string, "null"], pattern: "^\\d{2}:\\d{2}$" }
        courseId: { type: [string, "null"] }

    TaskMove:
      type: object
      required: [columnId, index]
      additionalProperties: false
      properties:
        columnId: { type: string }
        index: { type: integer, minimum: 0, description: "Among the target column's live tasks after removing this one; clamped to the end" }

    ChecklistReplace:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 200
          items:
            type: object
            required: [text, done]
            additionalProperties: false
            properties:
              id: { type: string, description: "Existing item id to keep; omitted for new items" }
              text: { type: string, minLength: 1, maxLength: 500 }
              done: { type: boolean }

    QuickNote:
      type: object
      required: [id, taskId, title, body, version, createdAt, updatedAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 20000 }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    QuickNoteWrite:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 20000 }

    EventCreateAddition:
      type: object
      description: "The 009 EventCreate body plus addToBoard"
      properties:
        addToBoard:
          type: [object, "null"]
          required: [columnId]
          properties:
            columnId: { type: string }

    SessionTaskAddition:
      type: object
      description: "Added to Session (001/009) in GET /sessions and GET /sessions/{sessionKey}"
      required: [taskId]
      properties:
        taskId: { type: [string, "null"], description: "Live task linked to this event occurrence; always null for classes" }

    LinkedTaskImpact:
      type: object
      required: [linkedTaskCount]
      properties:
        linkedTaskCount: { type: integer, minimum: 0 }

    CourseTaskImpact:
      type: object
      required: [linkedTaskCount, taskCount]
      properties:
        linkedTaskCount: { type: integer, minimum: 0 }
        taskCount: { type: integer, minimum: 0, description: "Tasks of the course that become personal" }

    TrashEntryTaskAddition:
      type: object
      description: "Added to TrashEntry (009) in GET /trash"
      required: [taskCount]
      properties:
        taskCount: { type: integer, minimum: 0 }
